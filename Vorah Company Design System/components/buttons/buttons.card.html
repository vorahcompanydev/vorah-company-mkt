<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--cream-50); padding: 28px; font-family: var(--font-sans); }
  .group { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .group:last-child { margin-bottom: 0; }
  .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--stone-500); width: 78px; flex: none; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Button, IconButton } = window.VorahCompanyDesignSystem_0977e7;
    function Demo() {
      return (
        <div>
          <div className="group">
            <span className="lbl">Variants</span>
            <Button variant="primary">Entrar em contato</Button>
            <Button variant="secondary">Saiba mais</Button>
            <Button variant="outline">Ver planos</Button>
            <Button variant="ghost">Sobre nós</Button>
          </div>
          <div className="group">
            <span className="lbl">Sizes</span>
            <Button size="sm">Pequeno</Button>
            <Button size="md">Médio</Button>
            <Button size="lg">Grande</Button>
          </div>
          <div className="group">
            <span className="lbl">States</span>
            <Button disabled>Desabilitado</Button>
            <Button variant="outline" disabled>Desabilitado</Button>
            <IconButton variant="primary" label="Avançar">›</IconButton>
            <IconButton variant="soft" label="Menu">≡</IconButton>
            <IconButton variant="dark" label="Fechar">✕</IconButton>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  </script>
</body>
</html>
