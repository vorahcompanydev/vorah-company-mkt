<!-- @dsCard group="Components" viewport="700x360" name="Cards, Badges, Stats & Avatars" subtitle="Content surfaces & the impacto-em-números device" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--cream-50); padding: 26px; font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  h4 { margin: 12px 0 6px; font-size: 19px; }
  p { margin: 0; color: var(--ink-500); font-size: 14px; line-height: 1.55; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .stats { display: flex; gap: 30px; margin-top: 16px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Card, Badge, Tag, Avatar, Stat } = window.VorahCompanyDesignSystem_0977e7;
    function Demo() {
      return (
        <div className="grid">
          <Card tone="paper" hover>
            <Badge tone="mint">Foco em vendas</Badge>
            <h4>Conteúdo com propósito</h4>
            <p>Conteúdo bonito é bom, mas conteúdo com propósito é o que traz faturamento.</p>
            <div className="chips">
              <Tag>Pet Shop</Tag>
              <Tag onRemove={() => {}}>Instagram</Tag>
            </div>
          </Card>
          <Card tone="dark">
            <Badge tone="dark">Resultados</Badge>
            <div className="stats">
              <Stat value="+430" label="Posts no feed" tone="amber" />
              <Stat value="85%" label="Sucesso" tone="cream" />
            </div>
            <div style={{display:"flex",gap:"10px",alignItems:"center",marginTop:"20px"}}>
              <Avatar name="Emily Smith" />
              <Avatar name="Sarah Nguyen" />
              <span style={{color:"var(--stone-400)",fontSize:"13px"}}>+ clientes atendidos</span>
            </div>
          </Card>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  </script>
</body>
</html>
