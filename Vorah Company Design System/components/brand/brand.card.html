<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); }
  .strip { display: flex; }
  .light { background: var(--cream-50); }
  .dark { background: var(--charcoal-900); }
  .cell { flex: 1; padding: 22px 26px; display: flex; align-items: center; justify-content: center; }
  .heads { padding: 28px 26px; background: var(--white); }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Logo, SectionHeading } = window.VorahCompanyDesignSystem_0977e7;
    function Demo() {
      return (
        <div>
          <div className="strip">
            <div className="cell light"><Logo size={30} tone="ink" /></div>
            <div className="cell dark"><Logo size={30} tone="cream" /></div>
          </div>
          <div className="heads">
            <SectionHeading
              eyebrow="Nosso diferencial"
              title="Marketing com estratégia, leveza e parceria"
              intro="Unimos estratégia + execução, com foco em resultados. Nosso processo é claro, colaborativo e pensado para gerar valor real."
            />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  </script>
</body>
</html>
