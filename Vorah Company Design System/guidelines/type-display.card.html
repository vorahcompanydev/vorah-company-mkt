<!-- @dsCard group="Type" viewport="700x230" name="Display serif — Petrona" subtitle="Warm rounded serif for headlines & brand voice" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--cream-50); padding: 28px 32px; }
  .big { font-family: var(--font-title); font-weight: 600; font-size: 58px; line-height: 1.0; letter-spacing: -0.02em; color: var(--charcoal-900); margin: 0; }
  .sub { font-family: var(--font-display); font-weight: 400; font-style: italic; font-size: 22px; color: var(--ink-500); margin: 10px 0 0; }
  .meta { font-family: var(--font-sans); font-size: 12px; letter-spacing: 0.04em; color: var(--stone-500); margin-top: 18px; text-transform: uppercase; }
</style>
</head>
<body>
  <p class="big">Conectamos marcas e pessoas</p>
  <p class="sub">com intenção, leveza e parceria.</p>
  <p class="meta">Petrona · 400 / 500 / 600 / 700 · --font-display</p>
</body>
</html>
