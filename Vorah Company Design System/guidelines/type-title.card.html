<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--cream-50); padding: 28px 32px; }
  .big { font-family: var(--font-title); font-weight: 600; font-size: 46px; line-height: 1.02; letter-spacing: -0.02em; color: var(--charcoal-900); margin: 0; white-space: nowrap; }
  .row { display: flex; gap: 20px; align-items: baseline; margin-top: 14px; }
  .w { font-family: var(--font-title); color: var(--charcoal-900); line-height: 1; }
  .meta { font-family: var(--font-sans); font-size: 12px; letter-spacing: 0.04em; color: var(--stone-500); margin-top: 20px; text-transform: uppercase; }
</style>
</head>
<body>
  <p class="big">Conectamos marcas e pessoas</p>
  <div class="row">
    <span class="w" style="font-weight:400; font-size:30px;">Aa</span>
    <span class="w" style="font-weight:500; font-size:30px;">Aa</span>
    <span class="w" style="font-weight:600; font-size:30px;">Aa</span>
    <span class="w" style="font-weight:700; font-size:30px;">Aa</span>
  </div>
  <p class="meta">Karelle · títulos / display · --font-title · --heading-font</p>
</body>
</html>
