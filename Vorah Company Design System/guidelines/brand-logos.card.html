<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; display: flex; height: 230px; font-family: var(--font-sans); }
  .panel { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .light { background: var(--cream-50); }
  .dark { background: var(--charcoal-900); }
  img { max-width: 78%; max-height: 150px; object-fit: contain; }
</style>
</head>
<body>
  <div class="panel light"><img src="../assets/logo-horizontal-black.png" alt="Vorah Company logo"></div>
  <div class="panel dark"><img src="../assets/logo-lockup-dark.png" alt="Vorah Company logo on charcoal"></div>
</body>
</html>
