<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--cream-50); padding: 24px; font-family: var(--font-sans); }
  .row { display: flex; gap: 12px; }
  .sw { flex: 1; border-radius: var(--radius-md); height: 118px; padding: 14px; display: flex; flex-direction: column; justify-content: flex-end; box-shadow: var(--shadow-sm); }
  .name { font-family: var(--font-title); font-size: 18px; font-weight: 600; color: var(--cream-50); }
  .hex { font-size: 11px; color: rgba(250,247,241,0.75); text-transform: uppercase; letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--cocoa-700)"><div class="name">Cocoa</div><div class="hex">#583432</div></div>
    <div class="sw" style="background:var(--forest-700)"><div class="name">Forest</div><div class="hex">#36492e</div></div>
    <div class="sw" style="background:var(--teal-800)"><div class="name">Teal</div><div class="hex">#203e4a</div></div>
    <div class="sw" style="background:var(--charcoal-900)"><div class="name">Charcoal</div><div class="hex">#27272a</div></div>
  </div>
</body>
</html>
