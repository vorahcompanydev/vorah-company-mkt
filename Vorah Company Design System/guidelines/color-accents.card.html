<!-- @dsCard group="Colors" viewport="700x170" name="Bright accents" subtitle="Mint & yellow — small pops only" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--charcoal-900); padding: 24px; font-family: var(--font-sans); }
  .row { display: flex; gap: 12px; }
  .sw { flex: 1; border-radius: var(--radius-md); overflow: hidden; }
  .chip { height: 64px; }
  .cap { padding: 8px 12px; background: #1f1f22; }
  .name { font-size: 12px; font-weight: 700; color: var(--cream-50); }
  .hex { font-size: 11px; color: var(--stone-400); text-transform: uppercase; letter-spacing: 0.03em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--mint-300)"></div><div class="cap"><div class="name">Mint 300</div><div class="hex">#b3f5a0</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--mint-500)"></div><div class="cap"><div class="name">Mint 500</div><div class="hex">#7fd96a</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--yellow-300)"></div><div class="cap"><div class="name">Yellow 300</div><div class="hex">#ffea6d</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--yellow-500)"></div><div class="cap"><div class="name">Yellow 500</div><div class="hex">#f5cf2e</div></div></div>
  </div>
</body>
</html>
