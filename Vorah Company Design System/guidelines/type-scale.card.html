<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="Display steps from 76 → 14px" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--white); padding: 22px 32px; }
  .line { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--stone-100); padding: 7px 0; }
  .line:last-child { border-bottom: none; }
  .label { font-family: var(--font-sans); font-size: 11px; color: var(--stone-500); width: 96px; flex: none; letter-spacing: 0.03em; }
  .spec { font-family: var(--font-title); color: var(--charcoal-900); font-weight: 600; line-height: 1; white-space: nowrap; }
</style>
</head>
<body>
  <div class="line"><span class="label">5xl · 76</span><span class="spec" style="font-size:48px">Vorah</span></div>
  <div class="line"><span class="label">3xl · 48</span><span class="spec" style="font-size:38px">Resultados reais</span></div>
  <div class="line"><span class="label">2xl · 36</span><span class="spec" style="font-size:30px">O que fazemos</span></div>
  <div class="line"><span class="label">xl · 28</span><span class="spec" style="font-size:24px">Nosso diferencial</span></div>
  <div class="line"><span class="label">lg · 22</span><span class="spec" style="font-size:20px">Foco em vendas</span></div>
  <div class="line"><span class="label">base · 16</span><span class="spec" style="font-size:16px;font-family:var(--font-sans);font-weight:400">Texto de corpo padrão</span></div>
</body>
</html>
