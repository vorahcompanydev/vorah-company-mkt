<!-- @dsCard group="Type" viewport="700x230" name="Body sans — Outfit" subtitle="Geometric sans for body, UI & labels" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--white); padding: 26px 32px; font-family: var(--font-sans); color: var(--charcoal-900); }
  .lead { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
  p { font-size: 15px; line-height: 1.65; color: var(--ink-700); margin: 0 0 12px; max-width: 600px; }
  .weights { display: flex; gap: 22px; flex-wrap: wrap; font-size: 15px; }
  .weights span { color: var(--charcoal-900); }
  .meta { font-size: 12px; letter-spacing: 0.04em; color: var(--stone-500); margin-top: 14px; text-transform: uppercase; }
</style>
</head>
<body>
  <p class="lead">Marketing com estratégia, leveza e parceria.</p>
  <p>Ajudamos pequenas e médias empresas a se posicionar com clareza, atrair clientes e vender com consistência. Atendimento 100% online e 100% humano.</p>
  <div class="weights">
    <span style="font-weight:300">Light 300</span>
    <span style="font-weight:400">Regular 400</span>
    <span style="font-weight:600">Semibold 600</span>
    <span style="font-weight:700">Bold 700</span>
    <span style="font-weight:800">Extrabold 800</span>
  </div>
  <p class="meta">Outfit · 300 / 400 / 600 / 700 · --font-sans</p>
</body>
</html>
