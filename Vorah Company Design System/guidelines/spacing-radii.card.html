<!-- @dsCard group="Spacing" viewport="700x190" name="Radii" subtitle="Soft friendly corners + the petal blob" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--cream-50); padding: 24px; font-family: var(--font-sans); }
  .row { display: flex; gap: 16px; align-items: flex-end; }
  .item { text-align: center; }
  .box { width: 84px; height: 70px; background: var(--amber-500); }
  .lbl { font-size: 11px; color: var(--ink-700); margin-top: 8px; }
  .lbl b { display: block; color: var(--charcoal-900); font-size: 12px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lbl"><b>sm</b>10px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lbl"><b>md</b>16px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lbl"><b>lg</b>24px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lbl"><b>xl</b>32px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-pill);width:110px"></div><div class="lbl"><b>pill</b>999px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-blob);background:var(--forest-700)"></div><div class="lbl"><b>blob</b>petal</div></div>
  </div>
</body>
</html>
