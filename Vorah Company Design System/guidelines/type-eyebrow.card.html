<!-- @dsCard group="Type" viewport="700x150" name="Eyebrow / label" subtitle="Uppercase, tracked — the COMPANY lockup style" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--cream-50); padding: 30px 32px; font-family: var(--font-sans); }
  .row { display: flex; flex-direction: column; gap: 16px; }
  .eyebrow { font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; font-size: 14px; color: var(--amber-700); }
  .company { font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; font-size: 18px; color: var(--charcoal-900); }
  .meta { font-size: 12px; letter-spacing: 0.04em; color: var(--stone-500); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="row">
    <span class="eyebrow">Nosso diferencial</span>
    <span class="company">Company</span>
    <span class="meta">Outfit Bold · tracking 0.18–0.22em · --tracking-caps</span>
  </div>
</body>
</html>
