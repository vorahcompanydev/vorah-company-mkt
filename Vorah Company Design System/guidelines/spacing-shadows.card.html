<!-- @dsCard group="Spacing" viewport="700x190" name="Shadows" subtitle="Warm, soft, low-spread elevation" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--cream-50); padding: 30px 24px; font-family: var(--font-sans); }
  .row { display: flex; gap: 22px; }
  .item { text-align: center; }
  .box { width: 110px; height: 72px; background: var(--white); border-radius: var(--radius-md); }
  .amber { background: var(--amber-500); }
  .lbl { font-size: 12px; color: var(--ink-700); margin-top: 14px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="lbl">xs</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="lbl">sm</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="lbl">md</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="lbl">lg</div></div>
    <div class="item"><div class="box amber" style="box-shadow:var(--shadow-amber)"></div><div class="lbl">amber glow</div></div>
  </div>
</body>
</html>
