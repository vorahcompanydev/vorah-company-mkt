<!-- @dsCard group="Colors" viewport="700x190" name="Amber — primary scale" subtitle="The saffron-gold brand accent" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--cream-50); padding: 24px; font-family: var(--font-sans); }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; border-radius: var(--radius-sm); overflow: hidden; box-shadow: var(--shadow-xs); }
  .chip { height: 72px; }
  .cap { padding: 8px 10px; background: var(--white); }
  .name { font-size: 12px; font-weight: 700; color: var(--charcoal-900); }
  .hex { font-size: 11px; color: var(--stone-500); text-transform: uppercase; letter-spacing: 0.03em; }
  .star { position: absolute; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--amber-100)"></div><div class="cap"><div class="name">100</div><div class="hex">#f9e8cd</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--amber-300)"></div><div class="cap"><div class="name">300</div><div class="hex">#efc07c</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--amber-500)"></div><div class="cap"><div class="name">500 · base</div><div class="hex">#eba851</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--amber-600)"></div><div class="cap"><div class="name">600</div><div class="hex">#db9038</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--amber-700)"></div><div class="cap"><div class="name">700</div><div class="hex">#b9762a</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--amber-800)"></div><div class="cap"><div class="name">800</div><div class="hex">#8f5b22</div></div></div>
  </div>
</body>
</html>
