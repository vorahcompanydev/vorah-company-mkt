<!-- @dsCard group="Spacing" viewport="700x150" name="Motion" subtitle="Gentle fades & rises — no bounce" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--white); padding: 26px 28px; font-family: var(--font-sans); }
  .grid { display: flex; gap: 28px; }
  .item { font-size: 13px; color: var(--ink-700); }
  .item b { display: block; color: var(--charcoal-900); font-size: 14px; margin-bottom: 3px; }
  .item code { font-family: var(--font-mono); font-size: 11px; color: var(--amber-700); }
  .dot { width: 40px; height: 8px; border-radius: 999px; background: var(--amber-500); margin-top: 12px; animation: slide 2.4s var(--ease-out) infinite; }
  @keyframes slide { 0%,100% { transform: translateX(0); opacity:.5 } 50% { transform: translateX(120px); opacity:1 } }
</style>
</head>
<body>
  <div class="grid">
    <div class="item"><b>fast · 140ms</b><code>--ease-standard</code></div>
    <div class="item"><b>base · 240ms</b><code>--ease-out</code></div>
    <div class="item"><b>slow · 420ms</b><code>--ease-out</code></div>
  </div>
  <div class="dot"></div>
</body>
</html>
