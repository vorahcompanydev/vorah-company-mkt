<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Depoimento de cliente — Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');
@font-face { font-family: 'Karelle'; src: url('../../../Vorah Company Design System/assets/fonts/Karelle.otf') format('opentype'); font-weight: 100 900; }

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --amber: #eba851;
  --charcoal: #27272a;
  --cream: #faf7f1;
  --cream2: #f4efe6;
  --stone: #8b8780;
}

.slide {
  position: relative;
  width: 1080px;
  height: 1080px;
  background: var(--cream);
  font-family: 'Outfit', sans-serif;
  color: var(--charcoal);
  overflow: hidden;
}

/* textura sutil da marca: silhueta grande da flor, quase imperceptível */
.mark-bg {
  position: absolute;
  right: -140px;
  bottom: -140px;
  width: 620px;
  height: auto;
  opacity: .05;
  z-index: 0;
}

.content {
  position: relative;
  z-index: 1;
  height: 100%;
  padding: 88px;
  display: flex;
  flex-direction: column;
}

.logo { display: flex; align-items: center; gap: 16px; }
.logo svg { width: 46px; height: auto; }
.logo .word {
  font-family: 'Outfit', sans-serif;
  font-weight: 800;
  font-size: 30px;
  letter-spacing: -.01em;
  color: var(--charcoal);
}
.logo .company {
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--stone);
  margin-top: 2px;
}

.eyebrow {
  margin-top: 64px;
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  font-size: 24px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--amber);
}

.aspas {
  font-family: 'Karelle', serif;
  font-weight: 600;
  font-size: 140px;
  line-height: .6;
  color: var(--amber);
  margin-top: 24px;
}

.quote-box {
  margin-top: 12px;
  padding: 32px 36px;
  border: 2px dashed #d8cfc0;
  border-radius: 20px;
  background: var(--cream2);
}
.quote-box .rotulo {
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  font-size: 18px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--stone);
  margin-bottom: 12px;
}
.quote-box .txt {
  font-family: 'Karelle', serif;
  font-style: italic;
  font-weight: 500;
  font-size: 40px;
  line-height: 1.25;
  color: var(--charcoal);
}

.corpo {
  margin-top: 32px;
  font-family: 'Outfit', sans-serif;
  font-weight: 400;
  font-size: 28px;
  line-height: 1.5;
  color: #4a4642;
  max-width: 780px;
}

.rodape {
  margin-top: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.cta {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-family: 'Outfit', sans-serif;
  font-weight: 600;
  font-size: 28px;
  padding: 24px 40px;
  border-radius: 999px;
  background: var(--amber);
  color: var(--charcoal);
}

.assinatura {
  font-family: 'Outfit', sans-serif;
  font-weight: 500;
  font-size: 18px;
  color: var(--stone);
}
</style>
</head>
